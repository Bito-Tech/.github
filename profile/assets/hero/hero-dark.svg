<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Bito-Tech Hero Dark</title>
  <desc id="desc">Dark luxury metallic 3D hero for Bito-Tech organization profile.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05070A"/>
      <stop offset="55%" stop-color="#0B1016"/>
      <stop offset="100%" stop-color="#121922"/>
    </linearGradient>

    <radialGradient id="halo" cx="67%" cy="47%" r="58%">
      <stop offset="0%" stop-color="#8CB7EA" stop-opacity="0.14"/>
      <stop offset="45%" stop-color="#6A86A8" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#9EC5F0" stroke-opacity="0.035" stroke-width="0.7"/>
    </pattern>

    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="14%" stop-color="#D8DFE7"/>
      <stop offset="30%" stop-color="#7B8796"/>
      <stop offset="48%" stop-color="#F5F7F9"/>
      <stop offset="67%" stop-color="#6D7887"/>
      <stop offset="85%" stop-color="#C8D0D9"/>
      <stop offset="100%" stop-color="#4D5865"/>
    </linearGradient>

    <linearGradient id="steelBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C9E2FF"/>
      <stop offset="45%" stop-color="#7EA8D6"/>
      <stop offset="100%" stop-color="#405E7F"/>
    </linearGradient>

    <linearGradient id="buttonLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F5F8FB"/>
      <stop offset="100%" stop-color="#CDD5DD"/>
    </linearGradient>

    <filter id="shadowXL" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity="0.70"/>
    </filter>

    <filter id="shadowMD" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000" flood-opacity="0.46"/>
    </filter>

    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>

    <clipPath id="heroLogoClip">
      <circle cx="130" cy="142" r="54"/>
    </clipPath>

    <clipPath id="coreLogoClip">
      <circle cx="824" cy="260" r="23"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect x="22" y="22" width="1156" height="476" rx="32" fill="url(#bg)" stroke="#2B3542" stroke-width="1.2"/>
  <rect x="22" y="22" width="1156" height="476" rx="32" fill="url(#grid)"/>
  <ellipse cx="830" cy="260" rx="400" ry="235" fill="url(#halo)"/>

  <!-- Top labels -->
  <text x="60" y="60" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="2.2" fill="#778394">B2 / TECHNOLOGY TEAM</text>
  <text x="1138" y="60" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.7" fill="#667384">PROFILE / DARK</text>

  <!-- LEFT SIDE -->
  <g transform="translate(64 82)">
    <!-- Big metallic logo plate -->
    <g filter="url(#shadowXL)">
      <circle cx="130" cy="142" r="62" fill="#0A0E13" stroke="#334050" stroke-width="1.4"/>
      <circle cx="130" cy="142" r="56" fill="url(#metal)" opacity="0.25"/>
      <image
        href="https://github.com/Bito-Tech.png?size=256"
        x="76"
        y="88"
        width="108"
        height="108"
        preserveAspectRatio="xMidYMid slice"
        clip-path="url(#heroLogoClip)"
      />
      <ellipse cx="117" cy="124" rx="28" ry="10" fill="#FFFFFF" opacity="0.14"/>
    </g>

    <text x="0" y="254" font-family="Segoe UI, Arial, sans-serif" font-size="45" font-weight="700" fill="#F4F7FA" letter-spacing="-1.2">Bito-Tech</text>

    <text x="0" y="298" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="500" fill="#D2D8E0">We build ideas into real systems.</text>

    <text x="0" y="330" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" fill="#8A96A6">
      Software engineering, intelligent systems,
    </text>
    <text x="0" y="350" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" fill="#8A96A6">
      and practical digital products.
    </text>

    <!-- chips -->
    <rect x="0" y="382" width="92" height="31" rx="10" fill="#0B1016" stroke="#303B48"/>
    <text x="46" y="402" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9.7" font-weight="700" letter-spacing="1.1" fill="#BBC5D1">SOFTWARE</text>

    <rect x="102" y="382" width="46" height="31" rx="10" fill="#0B1016" stroke="#303B48"/>
    <text x="125" y="402" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9.7" font-weight="700" letter-spacing="1.1" fill="#BBC5D1">AI</text>

    <rect x="158" y="382" width="116" height="31" rx="10" fill="#0B1016" stroke="#303B48"/>
    <text x="216" y="402" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9.7" font-weight="700" letter-spacing="1.1" fill="#BBC5D1">ENGINEERING</text>

    <rect x="284" y="382" width="92" height="31" rx="10" fill="#0B1016" stroke="#303B48"/>
    <text x="330" y="402" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9.7" font-weight="700" letter-spacing="1.1" fill="#BBC5D1">PRODUCTS</text>
  </g>

  <!-- divider -->
  <line x1="445" y1="88" x2="445" y2="432" stroke="#29323D"/>

  <!-- network rings -->
  <circle cx="824" cy="260" r="182" fill="none" stroke="#92B8E5" stroke-opacity="0.08"/>
  <circle cx="824" cy="260" r="128" fill="none" stroke="#92B8E5" stroke-opacity="0.06"/>
  <circle cx="824" cy="260" r="78" fill="none" stroke="#92B8E5" stroke-opacity="0.08"/>

  <!-- connections -->
  <g fill="none" stroke="#6A7B8E" stroke-opacity="0.34" stroke-width="1.1" stroke-linecap="round">
    <path d="M795 244 C738 188, 676 156, 608 134"/>
    <path d="M852 234 C914 170, 975 145, 1033 130"/>
    <path d="M875 277 C943 296, 997 327, 1044 361"/>
    <path d="M790 273 C727 289, 682 312, 630 329"/>
    <path d="M810 295 C766 335, 724 364, 690 394"/>
    <path d="M838 302 C839 340, 839 367, 843 402"/>
    <path d="M867 296 C909 337, 940 367, 963 400"/>
    <path d="M878 248 C937 239, 994 238, 1053 248"/>
  </g>

  <circle cx="714" cy="172" r="3.2" fill="#A5CAF4" opacity="0.72"/>
  <circle cx="938" cy="160" r="3.2" fill="#A5CAF4" opacity="0.72"/>
  <circle cx="973" cy="315" r="3.2" fill="#A5CAF4" opacity="0.72"/>

  <!-- core -->
  <g filter="url(#shadowXL)">
    <circle cx="824" cy="260" r="56" fill="#05080C" stroke="#3A4654" stroke-width="2"/>
    <circle cx="824" cy="260" r="48" fill="url(#metal)" stroke="#E6EBF1" stroke-opacity="0.34"/>
    <image
      href="https://github.com/Bito-Tech.png?size=128"
      x="801"
      y="237"
      width="46"
      height="46"
      preserveAspectRatio="xMidYMid slice"
      clip-path="url(#coreLogoClip)"
    />
    <ellipse cx="811" cy="243" rx="22" ry="8" fill="#FFFFFF" opacity="0.14"/>
  </g>

  <!-- projects -->
  <g font-family="Segoe UI, Arial, sans-serif" filter="url(#shadowMD)">
    <g>
      <rect x="528" y="104" width="158" height="58" rx="15" fill="#0A0F15" stroke="#3A4654"/>
      <circle cx="553" cy="133" r="12" fill="url(#metal)"/>
      <text x="553" y="137" text-anchor="middle" font-size="8" font-weight="900" fill="#222C36">01</text>
      <text x="579" y="129" font-size="12.5" font-weight="700" fill="#EFF3F7">MASARAK</text>
      <text x="579" y="147" font-size="9.5" fill="#7F8C9C">Guidance platform</text>
    </g>

    <g>
      <rect x="944" y="100" width="194" height="60" rx="15" fill="#0A0F15" stroke="#3A4654"/>
      <circle cx="969" cy="130" r="12" fill="url(#metal)"/>
      <text x="969" y="134" text-anchor="middle" font-size="8" font-weight="900" fill="#222C36">02</text>
      <text x="995" y="126" font-size="12.5" font-weight="700" fill="#EFF3F7">FRAUD DETECTION</text>
      <text x="995" y="145" font-size="9.5" fill="#7F8C9C">Machine learning</text>
    </g>

    <g>
      <rect x="978" y="341" width="160" height="58" rx="15" fill="#0A0F15" stroke="#3A4654"/>
      <circle cx="1003" cy="370" r="12" fill="url(#metal)"/>
      <text x="1003" y="374" text-anchor="middle" font-size="8" font-weight="900" fill="#222C36">03</text>
      <text x="1029" y="366" font-size="12.5" font-weight="700" fill="#EFF3F7">FEDRA</text>
      <text x="1029" y="384" font-size="9.5" fill="#7F8C9C">System design</text>
    </g>
  </g>

  <!-- members -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="11.3" font-weight="600">
    <g transform="translate(561 312)">
      <rect width="130" height="38" rx="12" fill="#090E13" stroke="#2F3946"/>
      <circle cx="19" cy="19" r="11" fill="url(#steelBlue)"/>
      <text x="19" y="23" text-anchor="middle" font-size="8.5" font-weight="800" fill="#10202F">AH</text>
      <text x="39" y="24" fill="#CBD4DE">Al-Harith</text>
    </g>

    <g transform="translate(625 382)">
      <rect width="139" height="38" rx="12" fill="#090E13" stroke="#2F3946"/>
      <circle cx="19" cy="19" r="11" fill="url(#steelBlue)"/>
      <text x="19" y="23" text-anchor="middle" font-size="8.5" font-weight="800" fill="#10202F">AB</text>
      <text x="39" y="24" fill="#CBD4DE">Abdullah</text>
    </g>

    <g transform="translate(789 400)">
      <rect width="108" height="38" rx="12" fill="#090E13" stroke="#2F3946"/>
      <circle cx="19" cy="19" r="11" fill="url(#steelBlue)"/>
      <text x="19" y="23" text-anchor="middle" font-size="8.5" font-weight="800" fill="#10202F">M</text>
      <text x="39" y="24" fill="#CBD4DE">Malek</text>
    </g>

    <g transform="translate(918 389)">
      <rect width="108" height="38" rx="12" fill="#090E13" stroke="#2F3946"/>
      <circle cx="19" cy="19" r="11" fill="url(#steelBlue)"/>
      <text x="19" y="23" text-anchor="middle" font-size="8.5" font-weight="800" fill="#10202F">A</text>
      <text x="39" y="24" fill="#CBD4DE">Ayman</text>
    </g>

    <g transform="translate(1034 230)">
      <rect width="118" height="38" rx="12" fill="#090E13" stroke="#2F3946"/>
      <circle cx="19" cy="19" r="11" fill="url(#steelBlue)"/>
      <text x="19" y="23" text-anchor="middle" font-size="8.5" font-weight="800" fill="#10202F">M</text>
      <text x="39" y="24" fill="#CBD4DE">Mulatif</text>
    </g>
  </g>

  <!-- ctas -->
  <g transform="translate(514 453)" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700">
    <rect x="0" y="0" width="128" height="36" rx="11" fill="#0C1117" stroke="#35404D"/>
    <text x="64" y="23" text-anchor="middle" fill="#E6EBF1">GitHub ↗</text>

    <rect x="141" y="0" width="136" height="36" rx="11" fill="url(#buttonLight)" stroke="#FFFFFF" stroke-opacity="0.25"/>
    <text x="209" y="23" text-anchor="middle" fill="#17212C">LinkedIn ↗</text>

    <rect x="290" y="0" width="160" height="36" rx="11" fill="#0C1117" stroke="#4A5868"/>
    <text x="370" y="23" text-anchor="middle" fill="#D6DEE7">Explore Work ↓</text>
  </g>

  <text x="60" y="474" font-family="Segoe UI, Arial, sans-serif" font-size="9.4" font-weight="600" letter-spacing="1.2" fill="#5E6A79">
    BUILDING TODAY. INNOVATING TOMORROW.
  </text>
</svg>
